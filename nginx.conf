# ==============================================================================
# ARISE PRODUCTION STUDIO - NGINX REVERSE PROXY CONFIGURATION (SSL & WEBSOCKET)
# Place at /etc/nginx/sites-available/arise-studio and link to sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name studio.yourdomain.com; # Replace with your VPS domain or IP

    # Redirect HTTP to HTTPS (uncomment after running certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
