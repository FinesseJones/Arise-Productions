services:
  arise-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arise-production-studio
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - VITE_API_URL=
    volumes:
      - arise_data:/app/backend/db
    networks:
      - default
      - caddy_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  arise_data:
    driver: local

networks:
  default:
  caddy_net:
    name: brand-first-app_default
    external: true
