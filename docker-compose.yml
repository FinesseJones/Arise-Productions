services:
  arise-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arise-production-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ARISE_USER=${ARISE_USER:-}
      - ARISE_PASS=${ARISE_PASS:-}
      - ARISE_API_TOKEN=${ARISE_API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - VITE_API_URL=
    volumes:
      - arise_data:/app/data
      - ./frontend/dist:/app/frontend/dist
      - ./backend:/app/backend
      - ./server.js:/app/server.js
      - ./storage:/app/storage
    networks:
      - default
      - caddy_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/projects', { headers: { Authorization: 'Bearer ' + (process.env.ARISE_API_TOKEN || '') } }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  arise_data:
    driver: local

networks:
  default:
  caddy_net:
    name: brand-first-app_default
    external: true
